name: Build image

# Builds a container image from another project's releases and publishes it to
# GHCR. This repository is a builder, not a fork: it checks out the upstream
# repository at a released tag and builds the Dockerfile that ships with it.
#
# Project-specific values live in the `env` block below.
#
# Triggers
#   schedule            hourly poll: builds the newest upstream release that has
#                       no complete image yet, and does nothing otherwise.
#   workflow_dispatch   manual build: pin a ref, pick platforms, force a rebuild.
#   repository_dispatch build on demand (event type `upstream-release`), e.g. from
#                       an external webhook, to publish minutes after upstream.
#   push                validates changes to this pipeline itself.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref: release version (0.38.0), tag, branch or SHA. Empty = newest release."
        type: string
        required: false
        default: ""
      platforms:
        description: "Platforms to build"
        type: choice
        options:
          - both
          - amd64
          - arm64
        default: both
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [upstream-release]
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-image.yml"
      - ".github/scripts/**"

# Default deny; each job grants exactly what it needs.
permissions: {}

# A cancelled publish can leave a half-written manifest list behind.
concurrency:
  group: build-image
  cancel-in-progress: false

env:
  # --- configuration ---------------------------------------------------------
  # Repository the image is built from.
  UPSTREAM: emdash-cms/emdash
  # Tag prefix marking a release of its core package. Monorepos publish one
  # release per package (`emdash@0.38.0`, `@emdash-cms/x402@0.38.0`, ...) for the
  # same commit; the prefix selects the releases that matter.
  RELEASE_PREFIX: emdash@
  # Image to publish: <registry>/<owner>/<name>, owner = this repository's owner.
  IMAGE: ghcr.io/${{ github.repository_owner }}/emdash
  # Build matrix: each platform is built on the runner listed next to it, so
  # arm64 uses GitHub's native ARM runner instead of QEMU emulation.
  PLATFORMS: >-
    [{"platform":"linux/amd64","runner":"ubuntu-latest"},
    {"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.inspect.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      revision: ${{ steps.resolve.outputs.revision }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      platform_count: ${{ steps.resolve.outputs.platform_count }}
      publish_latest: ${{ steps.resolve.outputs.publish_latest }}
    steps:
      - name: Resolve upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          INPUT_REF="${INPUT_REF:-}"
          ONLY="${INPUT_PLATFORMS:-both}"
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+$'

          NEWEST="$(gh api "repos/${UPSTREAM}/releases?per_page=100" --paginate \
            --jq '.[].tag_name' 2>/dev/null \
            | grep -E "^${RELEASE_PREFIX}[0-9]+\.[0-9]+\.[0-9]+$" \
            | sed "s/^${RELEASE_PREFIX}//" | sort -V | tail -1 || true)"
          echo "Newest release in ${UPSTREAM}: ${NEWEST:-<none>}"

          if [ -z "${INPUT_REF}" ] && [ -z "${NEWEST}" ]; then
            echo "::warning::No ${RELEASE_PREFIX}x.y.z release in ${UPSTREAM}: nothing to build."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${INPUT_REF}" ]; then
            CANDIDATE="${INPUT_REF#${RELEASE_PREFIX}}"
            CANDIDATE="${CANDIDATE#v}"
            if printf '%s' "${CANDIDATE}" | grep -qE "${SEMVER}"; then
              VERSION="${CANDIDATE}"
              REF="${RELEASE_PREFIX}${CANDIDATE}"
              KIND=release
            else
              REF="${INPUT_REF}"
              KIND=custom
              VERSION="$(printf '%s' "${INPUT_REF}" \
                | tr -c '[:alnum:]._-' '-' \
                | sed -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//' | cut -c1-60)"
              VERSION="${VERSION:-custom}"
            fi
          else
            VERSION="${NEWEST}"
            REF="${RELEASE_PREFIX}${NEWEST}"
            KIND=release
          fi

          if [ "${KIND}" = "release" ]; then
            REF_JSON="$(gh api "repos/${UPSTREAM}/git/ref/tags/${REF}")" \
              || { echo "::error::Tag ${REF} not found in ${UPSTREAM}."; exit 1; }
            REVISION="$(printf '%s' "${REF_JSON}" | jq -r '.object.sha')"
            if [ "$(printf '%s' "${REF_JSON}" | jq -r '.object.type')" = "tag" ]; then
              REVISION="$(gh api "repos/${UPSTREAM}/git/tags/${REVISION}" --jq '.object.sha')"
            fi
          else
            REVISION="$(gh api "repos/${UPSTREAM}/commits?sha=${REF}&per_page=1" --jq '.[0].sha')"
          fi

          # `both` keeps the full matrix; otherwise keep the matching platform.
          MATRIX="$(printf '%s' "${PLATFORMS}" | jq -c --arg only "${ONLY}" \
            'if $only == "both" then . else map(select(.platform | endswith($only))) end')"
          COUNT="$(printf '%s' "${MATRIX}" | jq 'length')"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::No platform in the matrix matches '${ONLY}'."
            exit 1
          fi
          WANT="$(printf '%s' "${MATRIX}" | jq -r '.[].platform' | paste -sd' ')"

          # `latest` follows the newest release, built for every platform.
          PUBLISH_LATEST=false
          if [ "${ONLY}" = "both" ] \
             && [ "${VERSION}" = "${NEWEST}" ] \
             && printf '%s' "${VERSION}" | grep -qE "${SEMVER}"; then
            PUBLISH_LATEST=true
          fi

          {
            echo "version=${VERSION}"
            echo "ref=${REF}"
            echo "revision=${REVISION}"
            echo "platforms=${WANT}"
            echo "platform_count=${COUNT}"
            echo "publish_latest=${PUBLISH_LATEST}"
            echo "found=true"
            echo "matrix<<MATRIX_EOF"
            echo "${MATRIX}"
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Target"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| upstream | \`${UPSTREAM}\` @ \`${REF}\` |"
            echo "| commit | \`${REVISION}\` |"
            echo "| image | \`${IMAGE}:${VERSION}\` |"
            echo "| platforms | \`${WANT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: steps.resolve.outputs.found == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect published image
        id: inspect
        if: steps.resolve.outputs.found == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          WANT: ${{ steps.resolve.outputs.platforms }}
          PUBLISH_LATEST: ${{ steps.resolve.outputs.publish_latest }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          FORCE="${FORCE:-false}"

          platforms_of() {
            docker manifest inspect "$1" 2>/dev/null \
              | jq -r 'if has("manifests")
                       then (.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)")
                       else "\(.os)/\(.architecture)" end' 2>/dev/null \
              | sort -u || true
          }

          HAVE=""
          if [ "${FORCE}" != "true" ]; then
            HAVE="$(platforms_of "${IMAGE}:${VERSION}")"
          fi

          MISSING=""
          for p in ${WANT}; do
            printf '%s\n' "${HAVE}" | grep -qx "${p}" || MISSING="${MISSING} ${p}"
          done
          MISSING="${MISSING# }"

          if [ -n "${MISSING}" ]; then
            MODE=build
          elif [ "${PUBLISH_LATEST}" = "true" ] \
               && ! docker manifest inspect "${IMAGE}:latest" >/dev/null 2>&1; then
            # Image complete, but `latest` was never created (a previous publish
            # may have failed): re-point the tag instead of rebuilding.
            MODE=retag
          else
            MODE=none
          fi

          echo "Existing platforms: ${HAVE:-<none>}"
          echo "Missing platforms: ${MISSING:-<none>}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.mode == 'build'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out ${{ env.UPSTREAM }} at ${{ needs.plan.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.plan.outputs.ref }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Apply Dockerfile compatibility patches
        run: |
          set -euo pipefail
          if [ -f .github/scripts/patch_dockerfile.py ]; then
            python3 .github/scripts/patch_dockerfile.py src/Dockerfile src/Dockerfile.patched
          else
            cp src/Dockerfile src/Dockerfile.patched
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is pushed by digest; the publish job turns the digests into a
      # single multi-arch manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/Dockerfile.patched
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM }}
            org.opencontainers.image.title=EmDash
            org.opencontainers.image.description=EmDash CMS (Astro, Node.js, SQLite) built from ${{ env.UPSTREAM }} ${{ needs.plan.outputs.ref }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: true
          sbom: true

      - name: Record digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          printf '%s\n' '${{ steps.build.outputs.digest }}' \
            > "/tmp/digests/$(printf '%s' '${{ matrix.platform }}' | tr '/' '-')"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [plan, build]
    # Runs on success and on partial failure (a platform that did build is still
    # useful), and on `retag` runs where nothing is built.
    if: >-
      always() &&
      needs.plan.outputs.mode != '' &&
      needs.plan.outputs.mode != 'none' &&
      (needs.plan.outputs.mode == 'retag' ||
       (needs.build.result != 'skipped' && needs.build.result != 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        if: needs.plan.outputs.mode == 'build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tags
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REVISION: ${{ needs.plan.outputs.revision }}
          MODE: ${{ needs.plan.outputs.mode }}
          PLATFORM_COUNT: ${{ needs.plan.outputs.platform_count }}
          PUBLISH_LATEST: ${{ needs.plan.outputs.publish_latest }}
        run: |
          set -euo pipefail
          SHORT="${REVISION:0:12}"
          TAGS=(-t "${IMAGE}:sha-${SHORT}")
          if printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            TAGS+=(-t "${IMAGE}:${VERSION}" -t "${IMAGE}:${VERSION%.*}")
          fi

          if [ "${MODE}" = "retag" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${VERSION}"
            echo "Pointed ${IMAGE}:latest at ${VERSION} (image already built, no rebuild)."
          else
            COUNT="$(find /tmp/digests -type f | wc -l | tr -d ' ')"
            if [ "${COUNT}" -eq 0 ]; then
              echo "::error::No digests to publish."
              exit 1
            fi
            if [ "${COUNT}" -ne "${PLATFORM_COUNT}" ]; then
              # A release tag must never point at an image missing platforms:
              # a partial build is published as an immutable sha tag only.
              echo "::warning::Partial build (${COUNT}/${PLATFORM_COUNT} platforms): publishing only ${IMAGE}:sha-${SHORT}."
              TAGS=(-t "${IMAGE}:sha-${SHORT}")
            elif [ "${PUBLISH_LATEST}" = "true" ]; then
              TAGS+=(-t "${IMAGE}:latest")
            fi
            DIGESTS=()
            while IFS= read -r f; do
              DIGESTS+=("${IMAGE}@$(cat "$f")")
            done < <(find /tmp/digests -type f | sort)
            docker buildx imagetools create "${TAGS[@]}" "${DIGESTS[@]}"
          fi

          printf 'published: %s\n' "${TAGS[@]}"

      - name: Verify published image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REVISION: ${{ needs.plan.outputs.revision }}
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw \
            | jq -r 'if has("manifests")
                     then (.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)  \(.digest)")
                     else "\(.os)/\(.architecture)" end' > /tmp/platforms.txt
          cat /tmp/platforms.txt
          {
            echo "### Published"
            echo
            echo "\`${IMAGE}:${VERSION}\` — upstream \`${REF}\` (\`${REVISION}\`)"
            echo
            echo "| platform | digest |"
            echo "| --- | --- |"
            while read -r line; do
              echo "| \`${line%% *}\` | \`${line##* }\` |"
            done < /tmp/platforms.txt
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
